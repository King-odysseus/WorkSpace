services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WORKSPACE_DB_NAME:-workspace}
      POSTGRES_USER: ${WORKSPACE_DB_USER:-workspace}
      POSTGRES_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Set WORKSPACE_DB_PASSWORD before starting compose}
    volumes:
      - workspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      WORKSPACE_DEBUG: "false"
      WORKSPACE_SECRET_KEY: ${WORKSPACE_SECRET_KEY:?Set WORKSPACE_SECRET_KEY before starting compose}
      WORKSPACE_SECURE_SSL_REDIRECT: ${WORKSPACE_SECURE_SSL_REDIRECT:-false}
      WORKSPACE_HSTS_SECONDS: ${WORKSPACE_HSTS_SECONDS:-0}
      WORKSPACE_HSTS_INCLUDE_SUBDOMAINS: ${WORKSPACE_HSTS_INCLUDE_SUBDOMAINS:-false}
      WORKSPACE_HSTS_PRELOAD: ${WORKSPACE_HSTS_PRELOAD:-false}
      WORKSPACE_ALLOWED_HOSTS: ${WORKSPACE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WORKSPACE_CSRF_TRUSTED_ORIGINS: ${WORKSPACE_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      WORKSPACE_DB_NAME: ${WORKSPACE_DB_NAME:-workspace}
      WORKSPACE_DB_USER: ${WORKSPACE_DB_USER:-workspace}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Set WORKSPACE_DB_PASSWORD before starting compose}
      WORKSPACE_DB_HOST: database
      WORKSPACE_DB_PORT: 5432
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      WORKSPACE_DEFAULT_FROM_EMAIL: ${WORKSPACE_DEFAULT_FROM_EMAIL:-}
      WORKSPACE_FRONTEND_BASE_URL: ${WORKSPACE_FRONTEND_BASE_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      WORKSPACE_SESSION_COOKIE_AGE: ${WORKSPACE_SESSION_COOKIE_AGE:-604800}
      WORKSPACE_LOGIN_FAILURE_LIMIT: ${WORKSPACE_LOGIN_FAILURE_LIMIT:-5}
      WORKSPACE_LOGIN_COOLOFF_MINUTES: ${WORKSPACE_LOGIN_COOLOFF_MINUTES:-15}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL:-}
      WORKSPACE_SENTRY_DSN: ${WORKSPACE_SENTRY_DSN:-}
      WORKSPACE_SENTRY_TRACES_SAMPLE_RATE: ${WORKSPACE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      - workspace-media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy

  reminder-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      WORKSPACE_DEBUG: "false"
      WORKSPACE_SECRET_KEY: ${WORKSPACE_SECRET_KEY:?Set WORKSPACE_SECRET_KEY before starting compose}
      WORKSPACE_ALLOWED_HOSTS: ${WORKSPACE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WORKSPACE_CSRF_TRUSTED_ORIGINS: ${WORKSPACE_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      WORKSPACE_DB_NAME: ${WORKSPACE_DB_NAME:-workspace}
      WORKSPACE_DB_USER: ${WORKSPACE_DB_USER:-workspace}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Set WORKSPACE_DB_PASSWORD before starting compose}
      WORKSPACE_DB_HOST: database
      WORKSPACE_DB_PORT: 5432
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      WORKSPACE_DEFAULT_FROM_EMAIL: ${WORKSPACE_DEFAULT_FROM_EMAIL:-}
      WORKSPACE_FRONTEND_BASE_URL: ${WORKSPACE_FRONTEND_BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL:-}
      WORKSPACE_SENTRY_DSN: ${WORKSPACE_SENTRY_DSN:-}
      WORKSPACE_SENTRY_TRACES_SAMPLE_RATE: ${WORKSPACE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    command: ["sh", "-c", "while true; do python manage.py deliver_calendar_reminders; python manage.py deliver_webhooks; python manage.py run_automation; python manage.py purge_screen_captures; sleep 60; done"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        VITE_SENTRY_DSN: ${WORKSPACE_SENTRY_DSN:-}
    ports:
      - "${WORKSPACE_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

volumes:
  workspace-postgres:
  workspace-media:
