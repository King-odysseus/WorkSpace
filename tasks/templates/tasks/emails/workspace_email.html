{% comment %}
Branded shell for every transactional email WorkSpace sends (invitations,
reminders). Table-based layout with inline styles on purpose: email clients
strip <style> blocks, ignore flexbox/grid, and Outlook needs tables. Colours
mirror the app's brand tokens in src/index.css (--color-navy #0B0B45,
--color-accent #C49A6C, --color-accent-soft #F1E4D0).

Context: title, paragraphs (list of strings), cta_label, cta_url, footer_note.
Every value is autoescaped - never mark email content safe.
{% endcomment %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F6F9; -webkit-font-smoothing:antialiased;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F4F6F9;">
<tr>
<td align="center" style="padding:28px 12px;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:100%; background-color:#FFFFFF; border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(7,26,46,0.08);">

<tr>
<td style="background-color:#0B0B45; padding:22px 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
<tr>
<td style="font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:17px; font-weight:700; color:#FFFFFF; letter-spacing:0.2px;">WorkSpace</td>
<td align="right" style="font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; color:#C49A6C; text-transform:uppercase; letter-spacing:1px;">Tijha</td>
</tr>
</table>
</td>
</tr>

<tr><td style="height:3px; background-color:#C49A6C; font-size:0; line-height:0;">&nbsp;</td></tr>

<tr>
<td style="padding:32px 32px 8px;">
<h1 style="margin:0 0 18px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:21px; line-height:1.3; font-weight:700; color:#071A2E;">{{ title }}</h1>
{% for paragraph in paragraphs %}
<p style="margin:0 0 14px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#4B5563;">{{ paragraph }}</p>
{% endfor %}
</td>
</tr>

{% if cta_url and cta_label %}
<tr>
<td style="padding:10px 32px 6px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="background-color:#C49A6C; border-radius:8px;">
<a href="{{ cta_url }}" style="display:inline-block; padding:13px 28px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#071A2E; text-decoration:none;">{{ cta_label }}</a>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:16px 32px 4px;">
<p style="margin:0 0 6px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#8B97A7;">If the button does not work, copy and paste this link into your browser:</p>
<p style="margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; word-break:break-all;"><a href="{{ cta_url }}" style="color:#1D4ED8; text-decoration:underline;">{{ cta_url }}</a></p>
</td>
</tr>
{% endif %}

<tr><td style="padding:26px 32px 0;"><div style="height:1px; background-color:#EEF0F3; font-size:0; line-height:0;">&nbsp;</div></td></tr>

<tr>
<td style="padding:16px 32px 30px;">
{% if footer_note %}
<p style="margin:0 0 8px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#8B97A7;">{{ footer_note }}</p>
{% endif %}
<p style="margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.5; color:#9DA8B5;">Sent by WorkSpace &middot; You are receiving this because your email address was used in a WorkSpace workspace.</p>
</td>
</tr>

</table>

</td>
</tr>
</table>
</body>
</html>
